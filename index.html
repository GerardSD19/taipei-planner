<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taipéi, noviembre y diciembre</title>
<meta name="description" content="Planificador de rutas por Taipéi: arrastra paradas, añade o quita sitios y mira cómo cambian los horarios de cada día.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
/* Hallmark · shape: app screen · genre: atmospheric · theme: Neón claro (vivid light, custom)
 * nav: top bar, the trip name and three actions · signature: the route drawn on a working grid over a schematic of the MRT and the two rivers, every stop a numbered disc with a placed label · states: empty day, marking on the map, all days, opening and closing warnings · bloom: daylight
 * axes: light/grotesk-sans/vivid · posture: committed · contrast: pass · fonts: Bricolage Grotesque for display and figures, Albert Sans for body · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V4 · weakest: S, a route list could be any planner; the map sits on the theme's working grid and the four days take the four lane tones */
/* Hallmark · dismissed F4 · the top-bar actions are sheet pills on paper, none filled; the one primary is the rubber cap on Añadir al día */
/* Hallmark · dismissed F7 · .tabs and .tab are a segmented control, .grip is the drag handle, .sw is a swatch dot beside a day name */

@import url("./tokens.css");
@import url("./base.css");

:root {
  --color-water: oklch(87% 0.075 222);
  --color-water-ink: oklch(47% 0.13 232);
  --color-line: oklch(89% 0.016 265);
  --shadow-label: oklch(20% 0.045 275 / 0.14);
  --bloom-1: oklch(59% 0.25 357 / 0.10);
  --bloom-2: oklch(56% 0.23 262 / 0.10);
  --bar-h: 68px;
}

body { font-variant-numeric: tabular-nums; min-height: 100dvh; font-size: 17px; background: radial-gradient(60vw 50vh at 100% 0%, var(--bloom-1), transparent 70%), radial-gradient(50vw 45vh at 0% 100%, var(--bloom-2), transparent 70%), var(--color-paper); background-attachment: fixed; }
button { cursor: pointer; }
h1, h2, h3 { font-weight: var(--display-weight); color: var(--color-ink); }

.bar { position: sticky; top: 0; z-index: var(--z-sticky-nav); min-height: var(--bar-h); display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); padding: var(--space-sm) var(--space-lg); background: var(--color-paper); box-shadow: 0 1px 0 var(--shade-1); }
.bar h1 { font-size: var(--text-xl); max-width: none; white-space: nowrap; }
.acts { display: flex; gap: var(--space-xs); flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm); min-height: 42px; padding: 0 var(--space-md); border: 0; border-radius: var(--radius-pill); background: var(--color-sheet); color: var(--color-ink); box-shadow: 0 0 0 1px var(--shade-1), 0 8px 18px -10px var(--shade-2), inset 0 1px 0 var(--hi); font: 500 var(--text-sm)/1 var(--font-body); white-space: nowrap; transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.btn:hover { background: var(--case); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn--primary { padding-left: var(--space-2xs); padding-right: var(--space-lg); min-height: 52px; }
.cap { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, var(--bezel), var(--color-paper-3)); box-shadow: inset 0 2px 3px var(--shade-2), 0 1px 0 var(--hi); }
.cap::after { content: ""; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(120% 110% at 50% 18%, var(--rubber-hi), var(--rubber) 48%, var(--rubber-lo)); box-shadow: inset 0 1px 0.5px var(--hi), 0 5px 9px -3px var(--shade-3); }
.btn--primary:active .cap::after { transform: translateY(1px); }
.btn[aria-pressed="true"] { background: var(--umber); color: var(--color-accent-ink); }

.app { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--space-lg); max-width: var(--container); margin-inline: auto; padding: var(--space-lg); }
.mapcol { position: sticky; top: calc(var(--bar-h) + var(--space-lg)); height: calc(100dvh - var(--bar-h) - 2 * var(--space-lg)); display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: var(--space-sm); }
.mapframe { position: relative; border-radius: var(--radius-card); overflow: hidden; background-color: var(--color-sheet); background-image: linear-gradient(to right, var(--grid-beat) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-beat) 1px, transparent 1px), linear-gradient(to right, var(--grid-16) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-16) 1px, transparent 1px); background-size: 120px 120px, 120px 120px, 30px 30px, 30px 30px; box-shadow: var(--shadow-card); min-height: 0; }
.mapframe svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapframe.marking { cursor: crosshair; box-shadow: var(--shadow-card), inset 0 0 0 2px var(--color-accent); }
.mapnote { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-md); font: 500 var(--text-sm)/1.3 var(--font-body); color: var(--color-muted); }
.key { display: inline-flex; align-items: center; gap: var(--space-xs); }
.narrow-only { display: none !important; }
.lbl-short { display: none; }
.sw { width: 10px; height: 10px; border-radius: var(--radius-pill); display: inline-block; flex: none; box-shadow: inset 0 1px 0 var(--hi); }

.water { fill: none; stroke: var(--color-water); stroke-linecap: round; stroke-linejoin: round; }
.mrt { fill: none; stroke: var(--color-line); stroke-linejoin: round; stroke-linecap: round; }
.route { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.route--dim { opacity: 0.18; }
.pin { cursor: pointer; }
.pin circle { stroke: var(--color-sheet); }
.pin text { font-family: var(--font-body); font-weight: 700; }
.pin.is-sel circle { stroke: var(--color-ink); }
.lab rect { fill: var(--color-sheet); }
.lab text { fill: var(--color-ink); font-family: var(--font-body); font-weight: 500; }
.lab.is-sel rect { fill: var(--umber); }
.lab.is-sel text { fill: var(--color-accent-ink); }
.lbl--river { fill: var(--color-water-ink); font-family: var(--font-body); font-weight: 500; }
.home rect { fill: var(--umber); }
.home text { fill: var(--color-accent-ink); font-family: var(--font-body); font-weight: 600; }
.ghost circle { fill: var(--rubber); stroke: var(--color-sheet); }

.panel { display: flex; flex-direction: column; gap: var(--space-lg); min-width: 0; }
.tabs { display: flex; gap: var(--space-2xs); padding: var(--space-2xs); background: var(--color-paper-2); border-radius: var(--radius-pill); box-shadow: inset 0 1px 2px var(--shade-1); overflow-x: auto; scrollbar-width: none; }
.tab { flex: 1 0 auto; min-height: 42px; padding: 0 var(--space-md); border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--color-ink-2); font: 500 var(--text-sm)/1 var(--font-body); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); white-space: nowrap; transition: background-color var(--dur-micro) var(--ease-out); }
.tab:hover { background: var(--color-paper-3); }
.tab:active { background: var(--case); }
.tab[aria-selected="true"] { background: var(--color-sheet); color: var(--color-ink); box-shadow: 0 0 0 1px var(--shade-1), 0 6px 14px -8px var(--shade-2), inset 0 1px 0 var(--hi); }
.tab.drop-on { background: var(--color-accent-soft); }

.day { background: var(--color-sheet); border-radius: var(--radius-card); padding: var(--space-lg); box-shadow: var(--shadow-card); }
.day + .day { margin-top: var(--space-md); }
.dayhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-md); align-items: start; margin-bottom: var(--space-md); }
.dayhead h2 { display: flex; align-items: center; gap: var(--space-sm); font-size: var(--text-2xl); max-width: none; }
.start { display: inline-flex; align-items: center; gap: var(--space-sm); margin-top: var(--space-sm); font: 500 var(--text-sm)/1 var(--font-body); color: var(--color-muted); }
input, select { min-height: 44px; border: 0; border-radius: var(--radius-pill); background: var(--color-sheet); color: var(--color-ink); padding: 0 var(--space-md); font: 400 var(--text-md)/1.2 var(--font-body); box-shadow: inset 0 0 0 1px var(--color-muted); margin: 0; }
input:focus-visible, select:focus-visible { outline: 0; box-shadow: inset 0 0 0 2px var(--color-accent); }
input[type="time"] { padding-right: var(--space-sm); }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.sel { position: relative; display: inline-grid; min-width: 0; }
.sel select { appearance: none; -webkit-appearance: none; width: 100%; padding-right: var(--space-xl); text-overflow: ellipsis; white-space: nowrap; overflow: hidden; cursor: pointer; }
.sel::after { content: ""; position: absolute; right: 16px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--color-ink-2); border-bottom: 1.5px solid var(--color-ink-2); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.sel--sm select { min-height: 36px; padding-left: var(--space-sm); padding-right: var(--space-lg); font-size: var(--text-sm); }
.sel--sm::after { right: 11px; width: 6px; height: 6px; }
.sum { text-align: right; }
.sum .figure { display: block; font: 400 var(--text-3xl)/0.95 var(--font-outlier); color: var(--color-ink); }
.sum small { display: block; margin-top: var(--space-2xs); font: 500 var(--text-xs)/1.4 var(--font-body); color: var(--color-muted); }
.sum.late .figure { color: var(--color-accent); }

.board { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 24px 3.9rem minmax(0, 1fr) auto; gap: var(--space-sm); align-items: center; padding: var(--space-sm); border-radius: var(--radius-inner); background: var(--case); box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--shade-1); }
.row.is-sel { box-shadow: inset 0 0 0 2px var(--color-accent); }
.row.dragging { opacity: 0.4; }
.row.drop-before { box-shadow: 0 -3px 0 var(--color-accent); }
.grip { width: 24px; height: 44px; display: grid; place-items: center; cursor: grab; color: var(--color-muted); border: 0; background: none; padding: 0; border-radius: var(--radius-pill); }
.grip:active { cursor: grabbing; }
.time { font: 600 var(--text-xl)/1 var(--font-body); white-space: nowrap; letter-spacing: -0.01em; }
.what { min-width: 0; }
.what b { display: flex; align-items: center; gap: var(--space-xs); font: 600 var(--text-md)/1.25 var(--font-body); overflow-wrap: anywhere; }
.no { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-pill); font: 700 var(--text-xs)/1 var(--font-body); box-shadow: inset 0 1px 0 var(--hi); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2xs) var(--space-xs); font-size: var(--text-sm); color: var(--color-muted); margin-top: var(--space-xs); }
.dur { width: 4.4rem; min-height: 34px; font-size: var(--text-sm); padding: 0 var(--space-sm); text-align: center; }
.tag { display: inline-flex; align-items: center; min-height: 24px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); background: var(--color-accent-soft); color: var(--color-ink); font: 500 var(--text-xs)/1 var(--font-body); white-space: nowrap; }
.tag--warn { background: var(--umber); color: var(--color-accent-ink); }
.rowacts { display: flex; gap: var(--space-2xs); align-items: center; }
.ibtn { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border: 0; border-radius: var(--radius-pill); background: var(--color-sheet); color: var(--color-ink); padding: 0; box-shadow: 0 0 0 1px var(--shade-1), inset 0 1px 0 var(--hi); transition: background-color var(--dur-micro) var(--ease-out); }
.ibtn:hover { background: var(--color-paper-2); }
.ibtn:active { background: var(--color-paper-3); }
.ibtn:disabled { opacity: 0.45; cursor: not-allowed; }
.mvwrap { width: 6.4rem; }
.leg { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-xs) 0 var(--space-xs) var(--space-lg); font: 500 var(--text-xs)/1.3 var(--font-body); color: var(--color-muted); }
.leg::before { content: ""; width: 2px; height: 18px; border-radius: 2px; background: var(--color-rule); }
.empty { padding: var(--space-lg); border-radius: var(--radius-inner); background: var(--case); color: var(--color-muted); }

.add { background: var(--color-sheet); border-radius: var(--radius-card); padding: var(--space-lg); display: grid; gap: var(--space-md); box-shadow: var(--shadow-card); }
.add h2 { font-size: var(--text-xl); }
.add .fields { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 6rem; gap: var(--space-sm); align-items: end; }
.add label { display: grid; gap: var(--space-xs); font: 500 var(--text-sm)/1 var(--font-body); color: var(--color-muted); min-width: 0; }
.add .sel, .add input { width: 100%; }
.add .go { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); }
.add .hint { font-size: var(--text-sm); color: var(--color-muted); min-height: 1lh; }

.foot { font-size: var(--text-sm); color: var(--color-muted); }
.toast { position: fixed; left: 50%; bottom: var(--space-lg); transform: translateX(-50%); z-index: var(--z-toast); background: var(--umber); color: var(--color-accent-ink); border-radius: var(--radius-pill); padding: var(--space-sm) var(--space-lg); font-size: var(--text-sm); box-shadow: var(--shadow-lift); opacity: 0; pointer-events: none; transition: opacity var(--dur-short) var(--ease-out); }
.toast.on { opacity: 1; }

@media (min-width: 60.01rem) and (max-width: 84rem) {
  .row { grid-template-columns: 24px 3.9rem minmax(0, 1fr); row-gap: var(--space-xs); }
  .rowacts { grid-column: 2 / -1; justify-content: flex-end; }
}
@media (max-width: 60rem) {
  :root { --bar-h: 60px; }
  .app { grid-template-columns: minmax(0, 1fr); padding: var(--space-md); gap: var(--space-md); }
  .mapcol { position: relative; top: 0; height: min(58dvh, 520px); }
  .bar { padding-inline: var(--space-md); }
  .lbl-long { display: none; }
  .lbl-short { display: inline; }
  .panel { gap: var(--space-md); }
  .tabs { position: sticky; top: calc(var(--bar-h) + var(--space-xs)); z-index: var(--z-sticky); box-shadow: inset 0 1px 2px var(--shade-1), 0 8px 18px -12px var(--shade-2); background: var(--color-paper-2); }
}
@media (max-width: 36rem) { .narrow-only { display: inline-flex !important; } }
@media (max-width: 40rem) {
  .bar { height: var(--bar-h); flex-wrap: nowrap; gap: var(--space-sm); }
  .bar h1 { font-size: var(--text-lg); }
  .acts { flex-wrap: nowrap; gap: var(--space-2xs); }
  .bar .btn { min-height: 38px; padding: 0 var(--space-sm); font-size: var(--text-sm); }
  .app { padding: var(--space-sm); gap: var(--space-sm); }
  .mapcol { height: min(52dvh, 460px); gap: var(--space-xs); }
  .mapnote { gap: var(--space-2xs) var(--space-sm); font-size: var(--text-xs); }
  .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tab { padding: 0 var(--space-2xs); gap: var(--space-2xs); font-size: var(--text-xs); min-height: 44px; }
  .day, .add { padding: var(--space-md); border-radius: var(--radius-inner); }
  .dayhead { grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
  .dayhead h2 { font-size: var(--text-xl); }
  .start { flex-wrap: wrap; }
  .sum .figure { font-size: var(--text-2xl); }
  .row { grid-template-columns: 3.6rem minmax(0, 1fr); gap: var(--space-xs) var(--space-sm); padding: var(--space-sm); }
  .row .grip { display: none; }
  .time { font-size: var(--text-lg); align-self: start; padding-top: var(--space-3xs); }
  .rowacts { grid-column: 1 / -1; justify-content: flex-end; }
  .leg { padding-left: var(--space-md); }
  .add .fields { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .add .fields label:first-child { grid-column: 1 / -1; }
  .add .go .btn { flex: 1 1 100%; }
  .foot { padding-inline: var(--space-2xs); }
  .toast { bottom: calc(var(--space-md) + env(safe-area-inset-bottom)); max-width: calc(100vw - 2 * var(--space-md)); white-space: normal; text-align: center; }
}
@media (max-width: 22.5rem) {
  .bar h1 { font-size: var(--text-md); }
  .bar .btn { padding: 0 var(--space-xs); }
  .sw { width: 8px; height: 8px; }
  .dayhead { grid-template-columns: minmax(0, 1fr); }
}
@media (pointer: coarse) {
  input, select, .sel--sm select, .dur { font-size: 16px; }
  .ibtn { width: 44px; height: 44px; }
  .sel--sm select { min-height: 44px; }
  .dur { min-height: 40px; width: 4.8rem; }
  .grip { display: none; }
  .row { grid-template-columns: 3.9rem minmax(0, 1fr) auto; }
}
@media (pointer: coarse) and (max-width: 40rem) {
  .row { grid-template-columns: 3.6rem minmax(0, 1fr); }
}
</style>
</head>
<body>
<header class="bar">
  <h1>Taipéi<span class="lbl-long">, noviembre y diciembre</span></h1>
  <div class="acts">
    <button type="button" class="btn" id="undo" disabled>Deshacer</button>
    <button type="button" class="btn" id="copy">Copiar</button>
    <button type="button" class="btn" id="reset"><span class="lbl-long">Plan inicial</span><span class="lbl-short">Reiniciar</span></button>
  </div>
</header>

<main class="app">
  <section class="mapcol" aria-label="Mapa">
    <div class="mapframe" id="frame">
      <svg id="map" viewBox="0 0 800 929" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa esquemático de Taipéi con la ruta del día"></svg>
    </div>
    <div class="mapnote" id="legend"></div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist" aria-label="Días" id="tabs"></div>
    <div id="days"></div>

    <form class="add" id="addForm" novalidate>
      <h2>Añadir un sitio</h2>
      <div class="fields">
        <label>Lugar
          <span class="sel"><select id="addPlace" name="place"></select></span>
        </label>
        <label>Día
          <span class="sel"><select id="addDay" name="day"></select></span>
        </label>
        <label>Minutos
          <input id="addDur" name="dur" type="number" inputmode="numeric" min="15" max="480" step="15" value="60">
        </label>
      </div>
      <label id="customWrap" hidden>Nombre del sitio marcado
        <input id="customName" name="custom" type="text" autocomplete="off" placeholder="Por ejemplo, cafetería de Minsheng">
      </label>
      <div class="go">
        <button type="submit" class="btn btn--primary"><span class="cap" aria-hidden="true"></span>Añadir al día</button>
        <button type="button" class="btn" id="markBtn" aria-pressed="false">Marcar en el mapa</button>
      </div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </form>

    <p class="foot">Trayectos estimados por distancia: a pie por debajo de 900 m, si no MRT o taxi con la espera incluida. Esquema de mapa aproximado. Los cambios se guardan en este navegador.</p>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

};

const render = () => {
  renderTabs();
  $('days').innerHTML = (state.view === N ? [...Array(N).keys()] : [state.view]).map(renderDay).join('');
  drawMap();
  $('undo').disabled = history.length === 0;
  renderAddForm();
};

const find = uid => { for (let di = 0; di < N; di++) { const i = state.days[di].stops.findIndex(s => s.uid === uid); if (i > -1) return [di, i]; } return null; };

$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (!b) return; state.view = Number(b.dataset.view); save(); render(); });

$('days').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); const row = e.target.closest('.row');
  if (row && !btn && !e.target.closest('input,select')) { selected = row.dataset.uid; render(); return; }
  if (!btn || !row) return;
  const f = find(row.dataset.uid); if (!f) return; const [di, i] = f; const arr = state.days[di].stops;
  if (btn.dataset.act === 'del') { const n = arr[i].name; commit(() => arr.splice(i, 1)); toast(`Quitado: ${n}. Deshacer lo recupera.`); }
  if (btn.dataset.act === 'up' && i > 0) commit(() => arr.splice(i - 1, 0, arr.splice(i, 1)[0]));
  if (btn.dataset.act === 'down' && i < arr.length - 1) commit(() => arr.splice(i + 1, 0, arr.splice(i, 1)[0]));
});

$('days').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.dur) { const f = find(t.dataset.dur); const v = Math.min(480, Math.max(15, Math.round(Number(t.value) || 60))); if (f) commit(() => { state.days[f[0]].stops[f[1]].dur = v; }); }
  if (t.dataset.start) { const di = Number(t.dataset.start); if (t.value) commit(() => { state.days[di].start = t.value; }); }
  if (t.dataset.move) { const f = find(t.dataset.move); const to = Number(t.value); if (f && f[0] !== to) { commit(() => { const s = state.days[f[0]].stops.splice(f[1], 1)[0]; state.days[to].stops.push(s); }); toast(`Movido a ${DAYS[to].label}`); } }
});

const clearDrop = () => document.querySelectorAll('.drop-before,.drop-on').forEach(n => n.classList.remove('drop-before', 'drop-on'));
document.addEventListener('dragstart', e => { const row = e.target.closest && e.target.closest('.row'); if (!row) return; dragUid = row.dataset.uid; row.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragUid); e.dataTransfer.effectAllowed = 'move'; } catch (err) {} });
document.addEventListener('dragend', () => { dragUid = null; clearDrop(); document.querySelectorAll('.dragging').forEach(n => n.classList.remove('dragging')); });
document.addEventListener('dragover', e => {
  if (!dragUid) return; const row = e.target.closest('.row'); const tab = e.target.closest('.tab[data-dropday]'); const zone = e.target.closest('[data-dropday]');
  if (!row && !tab && !zone) return; e.preventDefault(); clearDrop();
  if (row) row.classList.add('drop-before'); else if (tab) tab.classList.add('drop-on');
});
document.addEventListener('drop', e => {
  if (!dragUid) return; const row = e.target.closest('.row'); const zone = e.target.closest('[data-dropday]'); if (!row && !zone) return; e.preventDefault();
  const from = find(dragUid); if (!from) return; const uid = dragUid; clearDrop();
  if (row && row.dataset.uid === uid) return;
  commit(() => {
    const s = state.days[from[0]].stops.splice(from[1], 1)[0];
    if (row) { const t = find(row.dataset.uid); state.days[t[0]].stops.splice(t[1], 0, s); }
    else state.days[Number(zone.dataset.dropday)].stops.push(s);
  });
  selected = uid; render();
});

$('map').addEventListener('click', e => {
  if (marking) {
    const svg = $('map'); const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse()); const [lat, lon] = unxy(p.x, p.y);
    ghost = { lat, lon }; $('addPlace').value = '__custom'; $('customWrap').hidden = false; $('customName').focus();
    $('hint').textContent = 'Punto marcado. Ponle nombre y pulsa Añadir al día.'; drawMap(); return;
  }
  const pin = e.target.closest('.pin'); if (pin) { selected = pin.dataset.uid; render(); const r = document.querySelector(`.row[data-uid="${CSS.escape(selected)}"]`); if (r && window.matchMedia('(min-width: 60.01rem)').matches) r.scrollIntoView({ block: 'nearest' }); }
});
$('map').addEventListener('keydown', e => { const pin = e.target.closest('.pin'); if (pin && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selected = pin.dataset.uid; render(); } });

const setMarking = on => { marking = on; $('markBtn').setAttribute('aria-pressed', String(on)); $('frame').classList.toggle('marking', on); $('hint').textContent = on ? 'Haz clic en el mapa donde está el sitio.' : ''; };
$('markBtn').addEventListener('click', () => setMarking(!marking));
$('addPlace').addEventListener('change', () => { const c = $('addPlace').value === '__custom'; $('customWrap').hidden = !c; if (!c) { ghost = null; setMarking(false); drawMap(); const p = P[$('addPlace').value]; if (p) $('addDur').value = p.dur; } else if (!ghost) setMarking(true); });

$('addForm').addEventListener('submit', e => {
  e.preventDefault(); const id = $('addPlace').value, di = Number($('addDay').value), dur = Math.min(480, Math.max(15, Number($('addDur').value) || 60));
  let s;
  if (id === '__custom') {
    const name = $('customName').value.trim();
    if (!ghost) { $('hint').textContent = 'Primero marca el sitio en el mapa.'; setMarking(true); return; }
    if (!name) { $('hint').textContent = 'Falta el nombre del sitio.'; $('customName').focus(); return; }
    s = { name, lat: ghost.lat, lon: ghost.lon, open: null, close: null };
  } else s = { name: P[id].name, lat: P[id].lat, lon: P[id].lon, open: P[id].open, close: P[id].close };
  s.uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); s.dur = dur;
  commit(() => { state.days[di].stops.push(s); if (state.view !== N) state.view = di; });
  selected = s.uid; ghost = null; $('customName').value = ''; $('customWrap').hidden = true; setMarking(false); render();
  toast(`Añadido a ${DAYS[di].label}: ${s.name}`);
});

$('undo').addEventListener('click', () => { const prev = history.pop(); if (!prev) return; state = JSON.parse(prev); save(); render(); toast('Deshecho'); });
$('reset').addEventListener('click', () => { commit(() => { const v = state.view; state = initial(); state.view = v; }); toast('Plan inicial recuperado. Deshacer vuelve a tu versión.'); });
$('copy').addEventListener('click', () => {
  const txt = DAYS.map((d, di) => { const p = plan(di); return [d.title + ' (salida ' + state.days[di].start + ')', ...p.rows.map(r => `${hhmm(r.arr)} ${r.s.name} (${r.s.dur} min)`), state.days[di].stops.length ? `${hhmm(p.end)} en casa` : 'Sin planes'].join('\n'); }).join('\n\n');
  try { navigator.clipboard.writeText(txt).then(() => toast('Plan copiado'), () => toast('El navegador no deja copiar aquí')); } catch (err) { toast('El navegador no deja copiar aquí'); }
});

render();
const mro = new ResizeObserver(() => drawMap()); mro.observe($('frame'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawMap());
}
</script>
</body>
</html>
